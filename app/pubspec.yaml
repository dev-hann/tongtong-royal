name: app
description: TongTong Royal Flutter client (Flame + Forge2D).
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.13.0

flutter:
  uses-material-design: true
  fonts:
    # Static weight instances (NOT the variable TTFs): Flutter does
    # not drive the wght axis of variable fonts from fontWeight
    # (issue 74643) — hierarchy collapsed to the default weight.
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-400.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-600.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-700.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800

dependencies:
  flame: ^1.18.0
  flutter:
    sdk: flutter
  forge2d: ^0.13.0
  phosphor_flutter: ^2.1.0
  shared_preferences: ^2.3.0
  tongtong_shared:
    path: ../shared
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
